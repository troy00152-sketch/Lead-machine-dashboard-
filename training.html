<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Videos — Acquisition Command Center</title>
<style>
:root{--bg:#0a1128;--card:#111c3f;--accent:#ff7a1a;--text:#e8ecf8;--muted:#8a93b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:32px 20px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:26px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.vid-card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,122,26,.15)}
.vid-card h2{font-size:17px;margin-bottom:4px}
.vid-card p{color:var(--muted);font-size:13px;margin-bottom:14px}
video{width:100%;border-radius:12px;display:block;background:#000}
.back{display:inline-block;margin-top:24px;color:var(--accent);text-decoration:none;font-size:14px}
.back:hover{text-decoration:underline}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 Training Videos</h1>
  <div class="sub">Step-by-step walkthroughs of your Acquisition Command Center.</div>

  <div class="vid-card">
    <h2>Part 1 — Dashboard, List Builder</h2>
    <p>Opening the dashboard from HighLevel, the overview tab, and pulling seller lists with List Builder.</p>
    <video controls preload="metadata" src="training-video-web.mp4"></video>
  </div>

  <a class="back" href="index.html">← Back to Command Center</a>
  <footer>© Direct Property Buyers</footer>
</div>
</body>
</html>
