# Netlify config for lead-machine-dashboard (troy00152-sketch/Lead-machine-dashboard-).
#
# ONLY scheduled-function bindings live here. Build settings stay in the
# Netlify UI — do NOT add a [build] section to this file without Troy's
# word: adding one would override the UI-configured build. After the deploy
# that first adds this file, verify in the Netlify UI that the build
# settings are unchanged and that gmail-token-watch shows the "Scheduled"
# badge with its next run.
#
# Schedules are UTC. 14:00 UTC = 09:00 EST / 10:00 EDT (Troy's morning,
# before the 11 AM send window — a dead Gmail token is caught before any
# title-order send is attempted that day).

[functions]
  included_files = ["knowledge/**"]

# Webhook bot await (Nov 26, 2026 silent-bot fix): telnyx-webhook now
# awaits the bot hook (bounded 22s) + push (~3s) before responding.
# Netlify's default 10s function timeout would kill the invocation
# mid-LLM-call and reproduce the silent bot, so this function gets the
# 26s maximum for synchronous functions.
[functions."telnyx-webhook"]
  timeout = 26

[functions."gmail-token-watch"]
  schedule = "0 14 * * *"

# Inbound-call sweep backstop (Nov 26, 2026): every minute it checks
# for inbound pairings whose ring budget is spent with no answer and
# no PSTN fallback attempted (legs whose hangup webhooks never
# arrived, or zero-leg F1 saves) and attempts the fallback — which is
# itself flag-gated (INBOUND_PSTN_FALLBACK_ENABLED), so with the flag
# off this is a no-op scan that only logs. Also bridges a PSTN
# fallback leg whose AMD verdict never landed (past 30s, assume human).
# Schedules are UTC. A 1-minute schedule means a fallback can fire
# 20-80s after the ring budget is spent; the event-driven trigger
# (agent-leg timeout call.hangup) is the fast path.
[functions."cc-inbound-sweep"]
  schedule = "* * * * *"
