<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Calendar — Direct Property Buyers</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#131a24; --panel:#161e2b; --panel2:#1c2536;
    --line:#26314a; --text:#e8edf5; --muted:#8b96ad; --muted2:#5d6a84;
    --accent:#ff6b1a; --accent2:#ff8c42; --green:#2ecc71; --red:#e74c3c;
    --blue:#3498db; --chip:#223052;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--accent2)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .topbar h1{font-size:22px}
  .topbar h1 span{color:var(--accent)}
  .topbar small{color:var(--muted);display:block;font-size:13px}
  .back{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:24px;padding:9px 16px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
  .back:hover{border-color:var(--accent);color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2)}
  .btn:disabled{background:var(--panel2);color:var(--muted2);border-color:var(--line);cursor:default}
  .btn.small{padding:6px 10px;font-size:13px}
  .field{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px;font-size:14px;font-family:inherit}
  .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,26,.15)}
  .error{background:rgba(231,76,60,.12);border:1px solid var(--red);color:#ff8a7a;border-radius:8px;padding:12px;font-size:14px;margin-bottom:16px}
  .empty{text-align:center;color:var(--muted);padding:32px 16px}
  .empty .big{font-size:32px;margin-bottom:8px}
  .note{color:var(--muted);font-size:13px}
  .hidden{display:none}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 18px;font-size:14px;display:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--chip);color:var(--text)}
  .pill.confirmed{background:rgba(46,204,113,.15);color:var(--green)}
  .pill.cancelled{background:rgba(231,76,60,.15);color:var(--red)}
  .pill.sync-ok{background:rgba(46,204,113,.15);color:var(--green)}
  .pill.sync-fail{background:rgba(231,76,60,.15);color:var(--red)}
  .pill.sync-blobs{background:rgba(255,176,46,.15);color:#ffb02e}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls .spacer{flex:1}
  #weekLabel{font-weight:700;font-size:15px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:12px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
  .form-grid label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .day-head{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
  .day-head:first-child{margin-top:0}
  .appt{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-bottom:8px;flex-wrap:wrap}
  .appt .a-time{font-weight:700;white-space:nowrap}
  .appt .a-name{font-weight:700}
  .appt .a-title{color:var(--muted)}
  .appt .a-phone{color:var(--muted);white-space:nowrap}
  .appt .spacer{flex:1}
</style>
<!-- PWA (v1): manifest, theme, iOS install support, service worker -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#050a14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Command Center" />
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>📅 <span>Calendar</span></h1>
      <small>Seller calls — booked appointments for the team</small>
    </div>
    <a class="back" href="/contacts.html" style="margin-left:0">👥 Contacts</a>
    <a class="back" href="/index.html">← Back to Dashboard</a>
  </div>

  <div id="authError" class="error hidden">
    Not signed in — open the <a href="/index.html">dashboard</a> and sign in first, then come back here.
  </div>
  <div id="loadError" class="error hidden"></div>

  <div class="controls">
    <button class="btn small" id="prevWeekBtn" type="button">‹ Prev week</button>
    <button class="btn small" id="todayBtn" type="button">Today</button>
    <button class="btn small" id="nextWeekBtn" type="button">Next week ›</button>
    <span id="weekLabel"></span>
    <span class="spacer"></span>
    <button class="btn small primary" id="newApptBtn" type="button">＋ New appointment</button>
  </div>

  <form class="panel hidden" id="apptFormWrap">
    <h2>New appointment</h2>
    <div class="form-grid">
      <div>
        <label for="apptName">Name</label>
        <input class="field" id="apptName" type="text" autocomplete="off">
      </div>
      <div>
        <label for="apptPhone">Phone</label>
        <input class="field" id="apptPhone" type="tel" autocomplete="off">
      </div>
      <div>
        <label for="apptStart">Start</label>
        <input class="field" id="apptStart" type="datetime-local">
      </div>
      <div>
        <label for="apptMinutes">Duration</label>
        <select class="field" id="apptMinutes">
          <option value="30">30 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn primary" id="apptSaveBtn" type="submit">Save</button>
      <span class="note" id="apptFormNote"></span>
    </div>
  </form>

  <main id="apptList" aria-label="Appointments this week"></main>
</div>

<div id="toast"></div>

<script>
'use strict';
var API = '/.netlify/functions/cc-calendar-api';

var state = {
  weekOffset: 0,
  appointments: [],
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function fmtPhone(e164) {
  var d = String(e164 || '').replace(/\D/g, '');
  if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
  if (d.length === 10) return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  return e164 || '';
}
function fmtDay(ts) {
  try {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', weekday: 'long', month: 'short', day: 'numeric',
    }).format(new Date(ts));
  } catch (e) { return ''; }
}
function fmtDayKey(ts) {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date(ts));
  } catch (e) { return String(ts); }
}
function fmtClock(ts) {
  try {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit',
    }).format(new Date(ts));
  } catch (e) { return ''; }
}
// HL sync badge (Nov 27, P0-4): a Blobs-only booking must be visibly
// different from a synced one. 'ok' -> Synced; 'failed' -> Sync failed
// with the HL error as a tooltip; anything else (skipped-no-config,
// pre-sync records) -> Blobs only.
function syncBadge(a) {
  if (a.hlSync === 'ok') {
    return '<span class="pill sync-ok" title="Synced to HighLevel' + (a.hlEventId ? ' · ' + esc(a.hlEventId) : '') + '">✓ Synced</span>';
  }
  if (a.hlSync === 'failed') {
    return '<span class="pill sync-fail" title="' + esc(a.hlError || 'HighLevel sync failed') + '">⚠ Sync failed</span>';
  }
  return '<span class="pill sync-blobs" title="Blobs-only — not on the HighLevel calendar">Blobs only</span>';
}

async function api(path, body) {
  var opts = { credentials: 'include' };
  if (body !== undefined) {
    opts.method = 'POST';
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  var r = await fetch(API + path, opts);
  var data = {};
  try { data = await r.json(); } catch (e) { data = {}; }
  if (!r.ok) {
    var err = new Error((data && data.error) || ('Request failed (HTTP ' + r.status + ')'));
    err.status = r.status;
    err.data = data;
    throw err;
  }
  return data;
}
function handleLoadError(e) {
  if (e && e.status === 401) {
    document.getElementById('authError').classList.remove('hidden');
  } else {
    var el = document.getElementById('loadError');
    el.textContent = 'Could not load appointments: ' + (e && e.message ? e.message : e);
    el.classList.remove('hidden');
  }
}

// Monday 00:00 (local) of the displayed week through Sunday 23:59:59.
function weekRange() {
  var now = new Date();
  var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dow = (monday.getDay() + 6) % 7; // Mon=0 … Sun=6
  monday.setDate(monday.getDate() - dow + state.weekOffset * 7);
  var sundayEnd = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7);
  return { fromMs: monday.getTime(), toMs: sundayEnd.getTime() - 1, monday: monday };
}

function renderWeek() {
  var range = weekRange();
  var sunday = new Date(range.monday.getFullYear(), range.monday.getMonth(), range.monday.getDate() + 6);
  document.getElementById('weekLabel').textContent = fmtDay(range.monday.getTime()) + ' – ' + fmtDay(sunday.getTime());
  var el = document.getElementById('apptList');
  var list = state.appointments.slice().sort(function (a, b) {
    return (Date.parse(a.startISO) || 0) - (Date.parse(b.startISO) || 0);
  });
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="big">📅</div><div>No appointments this week.</div></div>';
    return;
  }
  var html = '';
  var lastDay = '';
  list.forEach(function (a) {
    var startMs = Date.parse(a.startISO) || 0;
    var dayKey = fmtDayKey(startMs);
    if (dayKey !== lastDay) {
      html += '<div class="day-head">' + esc(fmtDay(startMs)) + '</div>';
      lastDay = dayKey;
    }
    var time = fmtClock(startMs) + (a.endISO ? ' – ' + fmtClock(Date.parse(a.endISO)) : '');
    html += '<div class="appt"><span class="a-time">' + esc(time) + '</span>' +
      '<span class="a-name">' + esc(a.name || '') + '</span>' +
      '<span class="a-phone">' + esc(fmtPhone(a.phone)) + '</span>' +
      '<span class="a-title">' + esc(a.title || '') + '</span>' +
      '<span class="spacer"></span>' +
      '<span class="pill ' + esc(a.status || '') + '">' + esc(a.status || '') + '</span>' +
      syncBadge(a) +
      (a.status === 'confirmed'
        ? '<button class="btn small" type="button" data-cancel="' + esc(a.id) + '">Cancel</button>'
        : '') +
      '</div>';
  });
  el.innerHTML = html;
}

async function loadWeek() {
  var range = weekRange();
  var data = await api('?action=list&from=' + range.fromMs + '&to=' + range.toMs);
  state.appointments = Array.isArray(data.appointments) ? data.appointments : [];
  renderWeek();
}

async function saveAppointment(ev) {
  ev.preventDefault();
  var name = document.getElementById('apptName').value.trim();
  var phone = document.getElementById('apptPhone').value.trim();
  var startVal = document.getElementById('apptStart').value;
  var minutes = parseInt(document.getElementById('apptMinutes').value, 10) || 30;
  var note = document.getElementById('apptFormNote');
  if (!name || !phone || !startVal) {
    note.textContent = 'Name, phone, and a start time are all required.';
    return;
  }
  note.textContent = '';
  try {
    await api('', {
      action: 'create',
      name: name,
      phone: phone,
      startISO: new Date(startVal).toISOString(),
      minutes: minutes,
    });
    document.getElementById('apptFormWrap').classList.add('hidden');
    document.getElementById('apptName').value = '';
    document.getElementById('apptPhone').value = '';
    document.getElementById('apptStart').value = '';
    toast('Appointment saved.');
    await loadWeek();
  } catch (e) {
    // Double-booking guard (Nov 27, P1-5): the API answers 409
    // slot_taken with free alternatives — show them, don't just fail.
    if (e && e.data && e.data.error === 'slot_taken') {
      var alts = Array.isArray(e.data.alternatives) ? e.data.alternatives : [];
      note.textContent = 'That time is already booked.' + (alts.length
        ? ' Try: ' + alts.map(function (iso) { var ms = Date.parse(iso); return fmtDay(ms) + ' ' + fmtClock(ms); }).join(', ') + '.'
        : '');
      return;
    }
    note.textContent = 'Could not save: ' + (e && e.message ? e.message : e);
  }
}

function init() {
  document.getElementById('prevWeekBtn').addEventListener('click', function () {
    state.weekOffset -= 1;
    loadWeek().catch(handleLoadError);
  });
  document.getElementById('nextWeekBtn').addEventListener('click', function () {
    state.weekOffset += 1;
    loadWeek().catch(handleLoadError);
  });
  document.getElementById('todayBtn').addEventListener('click', function () {
    state.weekOffset = 0;
    loadWeek().catch(handleLoadError);
  });
  document.getElementById('newApptBtn').addEventListener('click', function () {
    document.getElementById('apptFormWrap').classList.toggle('hidden');
  });
  document.getElementById('apptFormWrap').addEventListener('submit', saveAppointment);
  document.getElementById('apptList').addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('[data-cancel]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-cancel');
    api('', { action: 'cancel', id: id })
      .then(function () { toast('Appointment cancelled.'); return loadWeek(); })
      .catch(function (e) { toast('Could not cancel: ' + (e && e.message ? e.message : e)); });
  });
  loadWeek().catch(handleLoadError);
}

if (typeof document !== 'undefined' && document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else if (typeof document !== 'undefined') {
  init();
}
</script>
</body>
</html>
