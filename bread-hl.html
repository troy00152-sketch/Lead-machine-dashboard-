<!DOCTYPE html>
<html lang="en" data-theme="holographic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread AI — HighLevel CRM</title>
<style>
  :root{
    --bg:#050a14; --bg2:rgba(10,18,38,.88); --panel:rgba(13,25,48,.55); --panel2:rgba(20,35,65,.45);
    --ink:#e8f4ff; --ink-dim:#8fb0d0; --accent:#00d4ff; --accent2:#0090ff;
    --border:rgba(0,212,255,.25); --glow:0 0 18px rgba(0,212,255,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse at 15% -5%, rgba(0,212,255,.06), transparent 55%), var(--bg);
    color:var(--ink); display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:14px 18px; border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(5,15,35,.92), rgba(10,25,55,.88));
    display:flex; align-items:center; gap:12px; flex-shrink:0;
  }
  header .logo{font-size:26px}
  header h1{font-size:18px; font-weight:700; text-shadow:0 0 22px rgba(0,212,255,.45)}
  header h1 span{color:var(--accent); text-shadow:0 0 18px rgba(0,212,255,.8)}
  header .sub{font-size:11px; color:var(--ink-dim); margin-top:2px}
  #chat{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px}
  .msg{max-width:85%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#001220; font-weight:500; box-shadow:var(--glow)}
  .msg.bread{align-self:flex-start; background:var(--panel); border:1px solid var(--border); backdrop-filter:blur(8px)}
  .msg.bread.thinking{opacity:.6; font-style:italic}
  .msg .confirm-box{margin-top:10px; padding:10px; border:1px solid rgba(255,180,0,.4); border-radius:10px; background:rgba(255,180,0,.06)}
  .msg .confirm-box p{font-size:13px; margin-bottom:8px; color:#ffd27f}
  .msg .confirm-box button{
    background:linear-gradient(135deg,#ffb400,#ff8c00); color:#1a0e00; border:none;
    padding:8px 18px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; margin-right:8px;
  }
  .msg .confirm-box button.cancel{background:rgba(255,255,255,.1); color:var(--ink); border:1px solid var(--border)}
  .msg .confirm-box button:hover{filter:brightness(1.15)}
  #inputbar{display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--border); background:rgba(5,12,28,.92); flex-shrink:0}
  #input{
    flex:1; background:rgba(8,16,34,.75); border:1px solid var(--border); color:var(--ink);
    border-radius:10px; padding:12px 14px; font-size:14px; outline:none; resize:none; max-height:120px;
  }
  #input:focus{border-color:var(--accent); box-shadow:var(--glow)}
  #sendbtn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#001220; border:none;
    border-radius:10px; padding:0 22px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:var(--glow);
  }
  #sendbtn:hover{filter:brightness(1.1)}
  #sendbtn:disabled{opacity:.5; cursor:default}
  .hint{font-size:11px; color:var(--ink-dim); text-align:center; padding:6px; flex-shrink:0}
  .err{color:#ff6b6b; font-size:13px}
</style>
<!-- PWA (v1): manifest, theme, iOS install support, service worker -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#050a14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Command Center" />
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<header>
  <div class="logo">🍞</div>
  <div>
    <h1>Bread <span>AI</span></h1>
    <div class="sub">HighLevel CRM · direct property buyers</div>
  </div>
</header>
<div id="chat"></div>
<div class="hint">Ask about contacts, conversations, workflows — or tell Bread to tag, create deals, draft texts.</div>
<div id="inputbar">
  <textarea id="input" rows="1" placeholder="Who is Darryl Jones? · Is Indianapolis SMS published? · Tag him as hot lead…"></textarea>
  <button id="sendbtn">Send</button>
</div>

<script>
(function(){
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendbtn = document.getElementById('sendbtn');
  const history = []; // {role, content}

  // Pending SMS confirmation: {contactId, message}
  let pendingSms = null;

  function addMsg(role, html, cls){
    const d = document.createElement('div');
    d.className = 'msg ' + role + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Greeting
  addMsg('bread', 'Hey Troy — I\'m in your CRM now. Ask me about any contact, conversation, or workflow. I can look things up, tag leads, create deals, and draft texts. What do you need?');

  async function callBread(extraMessages){
    const msgs = history.concat(extraMessages || []);
    const res = await fetch('/.netlify/functions/bread-hl', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ messages: msgs }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status) + (data.detail ? ': ' + data.detail : ''));
    return data.reply;
  }

  // Check if the reply contains an SMS confirmation request
  function extractSmsConfirm(reply){
    // The backend prefixes with [AWAITING TROY CONFIRMATION] when the model
    // tried to send without confirmed=true. We render a Send button.
    if (reply.indexOf('[AWAITING TROY CONFIRMATION]') === -1) return null;
    const toMatch = reply.match(/To:\s*contact\s+(\S+)/i);
    const msgMatch = reply.match(/Message:\s*"([\s\S]*?)"\s*$/m) || reply.match(/Message:\s*"([\s\S]*)/);
    return {
      contactId: toMatch ? toMatch[1] : null,
      message: msgMatch ? msgMatch[1].trim() : null,
      raw: reply.replace('[AWAITING TROY CONFIRMATION]\n', '').trim(),
    };
  }

  async function send(){
    const text = input.value.trim();
    if (!text || sendbtn.disabled) return;
    input.value = '';
    sendbtn.disabled = true;

    addMsg('user', esc(text));
    history.push({ role: 'user', content: text });
    const thinking = addMsg('bread', '…', 'thinking');

    try {
      const reply = await callBread();
      thinking.remove();
      history.push({ role: 'assistant', content: reply });

      const sms = extractSmsConfirm(reply);
      if (sms && sms.contactId && sms.message) {
        pendingSms = sms;
        const box = document.createElement('div');
        box.className = 'confirm-box';
        box.innerHTML =
          '<p>⚠️ SMS ready to send — tap to confirm:</p>' +
          '<p style="color:var(--ink)">To: ' + esc(sms.contactId) + '<br>"' + esc(sms.message) + '"</p>' +
          '<button id="cf-send">Send SMS</button><button id="cf-cancel" class="cancel">Cancel</button>';
        const wrap = addMsg('bread', esc(sms.raw));
        wrap.appendChild(box);
        document.getElementById('cf-send').onclick = confirmSms;
        document.getElementById('cf-cancel').onclick = function(){
          pendingSms = null;
          box.innerHTML = '<p style="color:var(--ink-dim)">Cancelled — nothing sent.</p>';
        };
      } else {
        addMsg('bread', esc(reply).replace(/\n/g, '<br>'));
      }
    } catch (err) {
      thinking.remove();
      addMsg('bread', '<span class="err">Error: ' + esc(err.message) + '</span>');
    }
    sendbtn.disabled = false;
    input.focus();
  }

  async function confirmSms(){
    if (!pendingSms) return;
    const { contactId, message } = pendingSms;
    pendingSms = null;
    sendbtn.disabled = true;
    const thinking = addMsg('bread', 'Sending…', 'thinking');
    // Ask the backend to send with confirmed=true via a follow-up message
    history.push({ role: 'user', content: '[SYSTEM: Troy tapped Send. Resend the SMS now with confirmed=true.]' });
    try {
      const reply = await callBread();
      thinking.remove();
      history.push({ role: 'assistant', content: reply });
      addMsg('bread', esc(reply).replace(/\n/g, '<br>'));
    } catch (err) {
      thinking.remove();
      addMsg('bread', '<span class="err">Send failed: ' + esc(err.message) + '</span>');
    }
    sendbtn.disabled = false;
  }

  sendbtn.onclick = send;
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  // Auto-grow
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(120, input.scrollHeight) + 'px';
  });
})();
</script>
</body>
</html>
